<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="36" y="32" font-size="11.5" font-weight="600" letter-spacing="1.7" fill="#6B7280">CATENTA · C2 — SIX CONTRATS, TROIS COUCHES</text>
  <text x="36" y="64" font-size="29" font-weight="700" fill="#0F2540">Qui appelle qui — et surtout, qui n'appelle personne</text>
  <text x="36" y="90" font-size="15" fill="#52606D">Toutes les flèches vont dans le même sens. C'est cette asymétrie, et non le nombre de contrats, qui rend un module remplaçable sans toucher aux données.</text>

  <text x="350" y="124" font-size="11" font-weight="700" text-anchor="middle" fill="#0F766E">« ai-je ce rôle ? »</text>
  <text x="350" y="138" font-size="9.5" text-anchor="middle" fill="#94A3B8">RoleAware.ROLES — immutable</text>
  <text x="810" y="124" font-size="11" font-weight="700" text-anchor="middle" fill="#B45309">« écris ceci »</text>
  <text x="810" y="138" font-size="9.5" text-anchor="middle" fill="#94A3B8">adresses injectées à la construction</text>

  <rect x="36" y="146" width="264" height="274" rx="12" fill="#0F2540"/>
  <text x="56" y="176" font-size="17" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#FFFFFF">CatentaRoles</text>
  <text x="56" y="194" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#A7DFD8">L'AUTORITÉ — PERMANENTE</text>
  <text x="56" y="218" font-size="11" fill="#C7D6E4">Une seule question, posée par tous :</text>
  <text x="56" y="235" font-size="11" font-family="Consolas, Menlo, monospace" fill="#A7DFD8">hasRole(role, compte)</text>
  <line x1="56" y1="250" x2="280" y2="250" stroke="#2A4463"/>
  <text x="56" y="270" font-size="10" font-weight="700" letter-spacing="0.9" fill="#6E86A0">RÔLES ACTEURS — DES PERSONNES</text>
  <text x="56" y="287" font-size="10" fill="#C7D6E4">MANUFACTURER · LAB · PRACTITIONER</text>
  <text x="56" y="302" font-size="10" fill="#C7D6E4">DISTRIBUTOR · REGULATOR · REGISTRAR</text>
  <line x1="56" y1="316" x2="280" y2="316" stroke="#2A4463"/>
  <text x="56" y="336" font-size="10" font-weight="700" letter-spacing="0.9" fill="#6E86A0">RÔLES MODULES — DES CONTRATS</text>
  <text x="56" y="353" font-size="10" fill="#C7D6E4">PASSPORT_MINTER · PASSPORT_CONTROLLER</text>
  <text x="56" y="368" font-size="10" fill="#C7D6E4">LOT_MINTER · LOT_BURNER · LOT_CUSTODIAN</text>
  <text x="56" y="383" font-size="10" fill="#C7D6E4">CREDIT_MINTER · CREDIT_SPENDER</text>
  <text x="56" y="405" font-size="9.5" font-style="italic" fill="#6E86A0">Les deux familles sont tenues séparées.</text>

  <rect x="400" y="146" width="360" height="62" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
  <text x="418" y="169" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0F2540">PassportNFT</text>
  <text x="742" y="169" font-size="9.5" font-weight="700" text-anchor="end" fill="#0F766E">ERC-721 SOULBOUND · PERMANENT</text>
  <text x="418" y="187" font-size="10.5" fill="#52606D">Les passeports, leurs traits figés, la remise armée.</text>
  <text x="418" y="201" font-size="10" font-family="Consolas, Menlo, monospace" fill="#94A3B8">PASSPORT_MINTER · PASSPORT_CONTROLLER</text>

  <rect x="400" y="218" width="360" height="62" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
  <text x="418" y="241" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0F2540">MaterialLots</text>
  <text x="742" y="241" font-size="9.5" font-weight="700" text-anchor="end" fill="#0F766E">ERC-1155 · PERMANENT</text>
  <text x="418" y="259" font-size="10.5" fill="#52606D">Les lots, leur matière, leur unité, et la garde.</text>
  <text x="418" y="273" font-size="10" font-family="Consolas, Menlo, monospace" fill="#94A3B8">LOT_MINTER · LOT_BURNER · LOT_CUSTODIAN</text>

  <rect x="400" y="290" width="360" height="62" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
  <text x="418" y="313" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0F2540">CatentaCredit</text>
  <text x="742" y="313" font-size="9.5" font-weight="700" text-anchor="end" fill="#0F766E">ERC-20 NON TRANSF. · PERMANENT</text>
  <text x="418" y="331" font-size="10.5" fill="#52606D">Les soldes de crédits d'usage, brûlés à l'action.</text>
  <text x="418" y="345" font-size="10" font-family="Consolas, Menlo, monospace" fill="#94A3B8">CREDIT_SPENDER · CREDIT_MINTER pour l'admin</text>

  <rect x="400" y="362" width="360" height="62" rx="10" fill="#FCEDE6" stroke="#B45309" stroke-width="1.3"/>
  <text x="418" y="385" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0F2540">ActorRegistry</text>
  <text x="742" y="385" font-size="9.5" font-weight="700" text-anchor="end" fill="#B45309">IDENTITÉ · REMPLAÇABLE</text>
  <text x="418" y="403" font-size="10.5" fill="#52606D">Raison sociale et SIREN des acteurs agréés.</text>
  <text x="418" y="417" font-size="10" font-family="Consolas, Menlo, monospace" fill="#94A3B8">REGISTRAR — écrit par l'agent d'agrément</text>

  <rect x="860" y="146" width="384" height="274" rx="12" fill="#FCEDE6" stroke="#B45309" stroke-width="1.4"/>
  <text x="880" y="176" font-size="17" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0F2540">LifecycleModule</text>
  <text x="880" y="194" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#B45309">LA RÈGLE MÉTIER — REMPLAÇABLE</text>
  <text x="880" y="218" font-size="11" fill="#52606D">Déclaration des lots, expéditions en deux temps,</text>
  <text x="880" y="234" font-size="11" fill="#52606D">commandes avec cascade, prescriptions, cycle de vie</text>
  <text x="880" y="250" font-size="11" fill="#52606D">de la prothèse jusqu'à la pose.</text>
  <text x="880" y="272" font-size="10.5" font-weight="600" fill="#0F2540">19 écritures · 6 vues · 1 023 lignes · 20 117 octets</text>
  <line x1="880" y1="286" x2="1224" y2="286" stroke="#EAD6C6"/>
  <text x="880" y="306" font-size="10" font-weight="700" letter-spacing="0.9" fill="#B45309">CE QU'IL DÉTIENT EN PROPRE</text>
  <text x="880" y="323" font-size="10.5" fill="#52606D">Les statuts, les commandes, les prescriptions,</text>
  <text x="880" y="338" font-size="10.5" fill="#52606D">l'empreinte patient et la pose. Cet état-là, et lui</text>
  <text x="880" y="353" font-size="10.5" fill="#52606D">seul, serait perdu à son remplacement.</text>
  <line x1="880" y1="367" x2="1224" y2="367" stroke="#EAD6C6"/>
  <text x="880" y="387" font-size="10.5" font-style="italic" fill="#8A6440">RecallModule et BondModule s'ajouteront de la même</text>
  <text x="880" y="402" font-size="10.5" font-style="italic" fill="#8A6440">façon : on déploie, on accorde un rôle. Rien à toucher.</text>

  <path d="M 396,177 L 310,177 M 320,171 L 308,177 L 320,183" stroke="#0F766E" stroke-width="1.5" fill="none"/>
  <path d="M 396,249 L 310,249 M 320,243 L 308,249 L 320,255" stroke="#0F766E" stroke-width="1.5" fill="none"/>
  <path d="M 396,321 L 310,321 M 320,315 L 308,321 L 320,327" stroke="#0F766E" stroke-width="1.5" fill="none"/>
  <path d="M 396,393 L 310,393 M 320,387 L 308,393 L 320,399" stroke="#0F766E" stroke-width="1.5" fill="none"/>

  <path d="M 856,177 L 770,177 M 780,171 L 768,177 L 780,183" stroke="#B45309" stroke-width="1.5" fill="none"/>
  <path d="M 856,249 L 770,249 M 780,243 L 768,249 L 780,255" stroke="#B45309" stroke-width="1.5" fill="none"/>
  <path d="M 856,321 L 770,321 M 780,315 L 768,321 L 780,327" stroke="#B45309" stroke-width="1.5" fill="none"/>
  <text x="812" y="390" font-size="10.5" font-weight="700" text-anchor="middle" fill="#94A3B8">✕</text>
  <text x="812" y="406" font-size="8.5" text-anchor="middle" fill="#94A3B8">jamais</text>

  <path d="M 1052,420 L 1052,446 L 168,446 L 168,428 M 162,438 L 168,426 L 174,438" stroke="#0F766E" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/>
  <rect x="474" y="436" width="286" height="20" rx="4" fill="#FFFFFF"/>
  <text x="617" y="450" font-size="10.5" text-anchor="middle" fill="#0F766E">le module aussi passe par l'autorité — onlyRole</text>

  <rect x="36" y="470" width="392" height="134" rx="12" fill="#E5F4F1"/>
  <text x="58" y="496" font-size="13.5" font-weight="700" fill="#0B5B54">Aucune flèche ne revient</text>
  <text x="58" y="519" font-size="11" fill="#0F2540">Chaque contrat connaît l'autorité, et le module connaît</text>
  <text x="58" y="535" font-size="11" fill="#0F2540">les stockages qu'il pilote. Mais aucun stockage ne</text>
  <text x="58" y="551" font-size="11" fill="#0F2540">connaît de module : il ne vérifie qu'un rôle.</text>
  <text x="58" y="574" font-size="11" font-weight="600" fill="#0B5B54">C'est cette absence de flèche retour — et rien d'autre —</text>
  <text x="58" y="590" font-size="11" font-weight="600" fill="#0B5B54">qui permet de changer de module.</text>

  <rect x="444" y="470" width="392" height="134" rx="12" fill="#F7F9FA" stroke="#E2E8F0"/>
  <text x="466" y="496" font-size="13.5" font-weight="700" fill="#B45309">ActorRegistry est remplaçable, pas permanent</text>
  <text x="466" y="519" font-size="11" fill="#52606D">Personne ne l'appelle, aucune écriture métier n'en dépend,</text>
  <text x="466" y="535" font-size="11" fill="#52606D">et son schéma est le plus susceptible d'évoluer : SIREN</text>
  <text x="466" y="551" font-size="11" fill="#52606D">aujourd'hui, RPPS ou pays demain.</text>
  <text x="466" y="574" font-size="11" font-weight="600" fill="#0F2540">Le classer « permanent » aurait contredit la doctrine.</text>
  <text x="466" y="590" font-size="11" fill="#52606D">Perdre les libellés coûte une ressaisie, pas une traçabilité.</text>

  <rect x="852" y="470" width="392" height="134" rx="12" fill="#E5F4F1"/>
  <text x="874" y="496" font-size="13.5" font-weight="700" fill="#0B5B54">La preuve, par un test</text>
  <text x="874" y="519" font-size="11" fill="#0F2540">On déploie un module neuf, on lui accorde les rôles, on</text>
  <text x="874" y="535" font-size="11" fill="#0F2540">les révoque à l'ancien. Les passeports et les lots ne</text>
  <text x="874" y="551" font-size="11" fill="#0F2540">bougent pas ; l'ancien module révoque désormais.</text>
  <text x="874" y="574" font-size="11" font-weight="600" fill="#0B5B54">Vécu, pas théorique : le module a été remanié quatre</text>
  <text x="874" y="590" font-size="11" font-weight="600" fill="#0B5B54">fois sans jamais toucher aux stockages.</text>

  <rect x="36" y="616" width="1208" height="88" rx="12" fill="#F2F4F6"/>
  <text x="58" y="640" font-size="11.5" font-weight="700" fill="#0F2540">OpenZeppelin 5.6.1, version épinglée et imports nommés — ce que chaque extension achète</text>
  <text x="58" y="664" font-size="10.5" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0B5B54">AccessControlEnumerable</text>
  <text x="58" y="682" font-size="10" fill="#52606D">les rôles ET la liste des titulaires :</text>
  <text x="58" y="698" font-size="10" fill="#52606D">la vue /admin s'en passe d'indexeur</text>
  <text x="350" y="664" font-size="10.5" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0B5B54">AccessControlDefaultAdminRules</text>
  <text x="350" y="682" font-size="10" fill="#52606D">admin unique, transfert en deux temps,</text>
  <text x="350" y="698" font-size="10" fill="#52606D">délai de 3 jours inscrit au contrat</text>
  <text x="700" y="664" font-size="10.5" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#0B5B54">ERC721+Enumerable · ERC1155+Supply+Burnable · ERC20</text>
  <text x="700" y="682" font-size="10" fill="#52606D">les trois comptabilités, auditées. Enumerable et Supply donnent</text>
  <text x="700" y="698" font-size="10" fill="#52606D">les listes sans indexeur. IERC721Receiver : dans le contrat d'attaque seul.</text>
</svg>
