<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="36" y="32" font-size="11.5" font-weight="600" letter-spacing="1.7" fill="#6B7280">CATENTA · C4 — SÉCURITÉ ET AUTO-AUDIT</text>
  <text x="36" y="64" font-size="29" font-weight="700" fill="#0F2540">La méthode d'auto-audit — et ce qu'elle a réellement trouvé</text>
  <text x="36" y="90" font-size="15" fill="#52606D">Une revue structurée, pas un audit. Ce qui la rend crédible n'est pas la liste des familles passées en revue : c'est qu'elle a trouvé une faille dans mon propre code.</text>

  <text x="36" y="132" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#0F766E">LA MÉTHODE — QUATRE PASSES SUR LE MÊME CODE</text>

  <rect x="36" y="144" width="284" height="124" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="169" font-size="11" font-weight="700" fill="#0F766E">1</text>
  <text x="56" y="190" font-size="13.5" font-weight="700" fill="#0F2540">Fonction par fonction</text>
  <text x="56" y="212" font-size="11.5" fill="#52606D">Trois axes systématiques sur</text>
  <text x="56" y="229" font-size="11.5" fill="#52606D">chaque entrée publique : le rôle,</text>
  <text x="56" y="246" font-size="11.5" fill="#52606D">l'état, le montant.</text>

  <rect x="344" y="144" width="284" height="124" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="364" y="169" font-size="11" font-weight="700" fill="#0F766E">2</text>
  <text x="364" y="190" font-size="13.5" font-weight="700" fill="#0F2540">Par familles connues</text>
  <text x="364" y="212" font-size="11.5" fill="#52606D">Les quinze familles de l'atelier</text>
  <text x="364" y="229" font-size="11.5" fill="#52606D">Solidity Hacking, passées une à</text>
  <text x="364" y="246" font-size="11.5" fill="#52606D">une, avec un statut par famille.</text>

  <rect x="652" y="144" width="284" height="124" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="672" y="169" font-size="11" font-weight="700" fill="#0F766E">3</text>
  <text x="672" y="190" font-size="13.5" font-weight="700" fill="#0F2540">Audit IA en relecture croisée</text>
  <text x="672" y="212" font-size="11.5" fill="#52606D">Un second regard sur les mêmes</text>
  <text x="672" y="229" font-size="11.5" fill="#52606D">fonctions, qui ne partage pas mes</text>
  <text x="672" y="246" font-size="11.5" fill="#52606D">angles morts.</text>

  <rect x="960" y="144" width="284" height="124" rx="11" fill="#FCEDE6" stroke="#B45309" stroke-width="1.3"/>
  <text x="980" y="169" font-size="11" font-weight="700" fill="#B45309">4</text>
  <text x="980" y="190" font-size="13.5" font-weight="700" fill="#0F2540">Sur suspicion : on attaque</text>
  <text x="980" y="212" font-size="11.5" fill="#52606D">On écrit le contrat d'attaque. S'il</text>
  <text x="980" y="229" font-size="11.5" fill="#52606D">réussit, c'est une faille — et il</text>
  <text x="980" y="246" font-size="11.5" fill="#52606D">reste ensuite dans la suite de tests.</text>

  <text x="36" y="292" font-size="12.5" font-weight="700" fill="#0F2540">La règle qui tient le tout :<tspan font-weight="400"> pour chaque garde, un test qui vérifie qu'elle <tspan font-weight="700">révoque</tspan> — pas seulement qu'elle laisse passer. Un test qui ne fait que réussir ne prouve rien sur ce qui doit être refusé.</tspan></text>

  <rect x="36" y="312" width="1208" height="252" rx="14" fill="#FCEDE6"/>
  <text x="58" y="340" font-size="14.5" font-weight="700" fill="#B45309">LA FAILLE TROUVÉE<tspan font-size="13.5" font-weight="400" fill="#0F2540"> — réentrance à l'émission d'une prothèse. Pas un vol de fonds : une rupture de l'invariant central du registre, « une prescription, une prothèse ».</tspan></text>

  <rect x="58" y="352" width="380" height="192" rx="10" fill="#FFFFFF"/>
  <text x="78" y="378" font-size="13" font-weight="700" fill="#0F2540">Le symptôme</text>
  <text x="78" y="401" font-size="11.5" fill="#52606D">PassportNFT.mint passe par</text>
  <text x="78" y="418" font-size="11.5" fill="#52606D">_safeMint, qui rappelle le</text>
  <text x="78" y="435" font-size="11.5" fill="#52606D">laboratoire via onERC721Received.</text>
  <text x="78" y="459" font-size="11.5" fill="#52606D">Un laboratoire peut être un</text>
  <text x="78" y="476" font-size="11.5" fill="#52606D">contrat : il lui suffit d'implémenter</text>
  <text x="78" y="493" font-size="11.5" fill="#52606D">IERC721Receiver. Le registre lui rend</text>
  <text x="78" y="510" font-size="11.5" fill="#52606D">la main au milieu de son écriture.</text>

  <rect x="450" y="352" width="380" height="192" rx="10" fill="#FFFFFF"/>
  <text x="470" y="378" font-size="13" font-weight="700" fill="#0F2540">La cause</text>
  <text x="470" y="401" font-size="11.5" fill="#52606D">La prescription n'était marquée</text>
  <text x="470" y="418" font-size="11.5" fill="#52606D">« honorée » qu'APRÈS le mint.</text>
  <text x="470" y="442" font-size="11.5" fill="#52606D">Le laboratoire-contrat rentrait à</text>
  <text x="470" y="459" font-size="11.5" fill="#52606D">nouveau depuis le callback, voyait</text>
  <text x="470" y="476" font-size="11.5" fill="#52606D">la demande encore « acceptée », et</text>
  <text x="470" y="493" font-size="11.5" fill="#52606D">obtenait plusieurs passeports pour</text>
  <text x="470" y="510" font-size="11.5" fill="#52606D">une seule prescription.</text>

  <rect x="842" y="352" width="380" height="192" rx="10" fill="#FFFFFF"/>
  <text x="862" y="378" font-size="13" font-weight="700" fill="#0B5B54">La correction — zéro gas</text>
  <text x="862" y="400" font-size="11.5" fill="#52606D">Checks-effects-interactions : la</text>
  <text x="862" y="417" font-size="11.5" fill="#52606D">demande est consommée avant le mint.</text>
  <rect x="862" y="428" width="340" height="100" rx="6" fill="#0F2540"/>
  <text x="878" y="447" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#F87171">- PASSPORTS.mint(...);</text>
  <text x="878" y="462" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#F87171">- request.status = Fulfilled;</text>
  <text x="878" y="483" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#6EE7B7">+ request.status = Fulfilled;</text>
  <text x="878" y="498" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#6EE7B7">+ PASSPORTS.mint(...);</text>
  <text x="878" y="519" font-size="10" font-family="Consolas, Menlo, monospace" fill="#9DB3C8">ReentrantLab.sol garde l'attaque en test</text>
  <text x="58" y="558" font-size="11.5" font-style="italic" fill="#8A6440">La leçon, et deux des trois correctifs ci-dessous la répètent : une garde ne vaut qu'au moment où elle produit son effet, pas au moment où on l'écrit.</text>

  <rect x="36" y="576" width="1208" height="130" rx="14" fill="#F2F4F6"/>
  <text x="58" y="600" font-size="13" font-weight="700" fill="#0F2540">Trois autres correctifs, issus d'une seconde relecture sur les contrats devenus plus gros — chacun avec son test</text>

  <text x="58" y="624" font-size="11.5" font-weight="700" fill="#0B5B54">La garde pouvait frapper</text>
  <text x="58" y="642" font-size="10.5" fill="#52606D">transferCustody n'interdisait pas from == 0, que</text>
  <text x="58" y="657" font-size="10.5" fill="#52606D">l'ERC-1155 lit comme une frappe : un module sans</text>
  <text x="58" y="672" font-size="10.5" fill="#52606D">LOT_MINTER_ROLE créait de la matière.</text>

  <text x="470" y="624" font-size="11.5" font-weight="700" fill="#0B5B54">Une remise armée survivait à la pose</text>
  <text x="470" y="642" font-size="10.5" fill="#52606D">L'autorisation ne regardait plus le statut au moment</text>
  <text x="470" y="657" font-size="10.5" fill="#52606D">de l'accepter : une prothèse en bouche pouvait</text>
  <text x="470" y="672" font-size="10.5" fill="#52606D">encore changer de mains.</text>

  <text x="882" y="624" font-size="11.5" font-weight="700" fill="#0B5B54">Une expédition pouvait rester morte</text>
  <text x="882" y="642" font-size="10.5" fill="#52606D">Le destinataire ne pouvait pas refuser : il restait</text>
  <text x="882" y="657" font-size="10.5" fill="#52606D">bloqué sur une commande marquée « honorée »</text>
  <text x="882" y="672" font-size="10.5" fill="#52606D">que rien ne livrerait.</text>

  <text x="58" y="696" font-size="10.5" fill="#6B7280"><tspan font-weight="700" fill="#B45309">Ce qui n'est pas présent :</tspan> ni analyse statique automatisée, ni fuzzing, ni audit externe.   <tspan font-weight="700" fill="#B45309">Limites assumées :</tspan> un détenteur peut brûler sa propre matière — le rappel de lot devra composer avec — et une expédition reste sur-déclarable.</text>

</svg>
